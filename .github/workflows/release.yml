name: Build installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["VERSION", ".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Version
        id: v
        shell: bash
        run: echo "ver=$(tr -d '[:space:]' < VERSION)" >> $GITHUB_OUTPUT

      - name: Icono
        run: python assets/make_icon.py

      - name: Cliente de Google incluido (opcional)
        shell: bash
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_JSON" ]; then
            printf '%s' "$GOOGLE_CLIENT_JSON" > src/google_client.json
            echo "ADD=--add-data src/google_client.json;." >> $GITHUB_ENV
            echo "Cliente de Google incluido"
          fi

      - name: Prueba visual (claro y oscuro)
        shell: bash
        run: |
          mkdir -p capturas
          GUARDPY_THEME=light python src/main.py --selftest capturas/claro.png
          GUARDPY_THEME=dark GUARDPY_SCROLL=1 python src/main.py --selftest capturas/oscuro.png
          for f in capturas/*.png; do echo "IMG-BEGIN $f"; base64 -w 4000 "$f"; echo; echo "IMG-END"; done

      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas/*.png

      - name: Compilar exe
        shell: bash
        run: >
          pyinstaller --noconfirm --windowed --name Guardpy
          --icon assets/icon.ico --paths src
          --collect-data googleapiclient --collect-data sv_ttk --collect-all pywinstyles
          --add-data "VERSION;." $ADD
          src/main.py

      - name: Crear instalador (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.v.outputs.ver }} installer\Guardpy.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Guardpy-Setup
          path: dist/Guardpy-Setup-*.exe

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          name: Guardpy ${{ steps.v.outputs.ver }}
          files: dist/Guardpy-Setup-*.exe
          make_latest: true
          body: |
            **Guardpy ${{ steps.v.outputs.ver }}**: guarda tus carpetas en Google Drive a la hora que elijas y libera espacio en tu PC.

            1. Descarga `Guardpy-Setup-${{ steps.v.outputs.ver }}.exe` y ábrelo.
            2. Si Windows muestra *"Windows protegió su PC"*, pulsa **Más información → Ejecutar de todas formas** (el instalador no tiene firma digital).
